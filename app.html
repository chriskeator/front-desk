<script>

   Every block works the same: tap = pick (gold) + picker under the rows; drag the middle = move; drag an edge = stretch;
   snapped to the song's grid; a block stops at its neighbour (never covers it); Delete removes only that block;

function scClickOn(){ try { return localStorage.getItem("scClick") === "1"; } catch { return false; } }

function scChdOn(){ try { return localStorage.getItem("scChd") !== "0"; } catch { return true; } }
function scMelOn(){ try { return localStorage.getItem("scMel") !== "0"; } catch { return true; } }
let scId = null, scDoc = null, scLines = null, scWords = null, scChords = null, scRg = null, scSpan = 4, scPick = null, scCtx = null, scTimer = null, scPlayEnd = null, scPH = null, scView = null;
const SCDEG = {0:"1",1:"#1",2:"2",3:"b3",4:"3",5:"4",6:"#4",7:"5",8:"#5",9:"6",10:"b7",11:"7"};
const SCNUMS = ["1","2","b3","3","4","#4","5","6","b7","7"], SCCHS = ["1","4","5","6m","2m","3m"];
const SCBASS = {"1":36,"2m":38,"3m":40,"4":41,"5":43,"6m":45};
const scClone = x => JSON.parse(JSON.stringify(x));
/* (Oct 16, Chris) snap grid per song: 4/4 = 16ths, 3/4 and 6/8 = 8ths, swing = 8th triplets; doc.grid (steps per beat) wins, the Grid button cycles it */
const SCGRID = {4: "16ths", 2: "8ths", 3: "Swing"};
const scG = () => 4,   /* (Oct 16 night, Chris) no Grid button: every song snaps to 16ths */ scG1 = () => 1 / scG();
const scSnapG = g => Math.round(g * scG() + 1e-6) / scG();
const scQ = s => document.querySelector("#songchk " + s);
const scStep = () => scView || scDoc.step || 1;
const scRows = () => ((scDoc.rows || {})[scStep()] || []);
const scEnd = b => b.g + b.L;
function scRange(l){ const M = scDoc.meter, a = Math.floor(Math.min(...l.map(n => n.g)) / M + 1e-9) * M, b = Math.ceil(Math.max(...l.map(n => n.g + n.L)) / M - 1e-9) * M; return [a, Math.max(b, a + M)]; }
/* which blocks a step edits, and where each lane sits in the row (top, height in px) */
const scEdit = k => scStep() === 1 ? k !== "c" : k === "c";
const scLane = k => scStep() === 1 ? ({n: [6, 40], w: [52, 32]})[k] : ({c: [6, 26], n: [36, 40], w: [82, 32]})[k];

function scWordsFrom(L){ return L.map(l => l.filter(n => n.w).map(n => ({g: n.g, L: n.L, w: n.w}))); }
function scChordsFrom(L, rg){ return L.map((l, i) => { const C = []; l.forEach(n => (n.c || []).forEach(q => C.push({g: n.g + q[1], k: q[0]}))); C.sort((p, q) => p.g - q.g);
  const end = rg[i][0] + scSpan; return C.map((c, x) => Object.assign(c, {L: Math.max(scG1(), (x + 1 < C.length ? C[x + 1].g : end) - c.g)})); }); }

<script>
/* (Oct 15) Chris: db 'shortcheck' rows (one per cut: title, fileId, secs, source, order). Answers: status approved/dropped + note.
   Cadence's Mac script later moves Approved to "1 Approved" and Dropped to "2 Redo" and sets moved:true. */
let shRows = null, shI = 0, shTask = null, shWait = 0, shView = null, shOne = false;   /* (Oct 16, Chris) board = one Short, one step, then close; green boxes reopen (shView) */
/* (Oct 15) Chris: say exactly what to check; tap a check that is wrong (or type a note) = Send fixes.
   (Oct 15, Chris) HANDS FIRST, then Start + end, both on the Hands (cropped) video: fields hands/handsNote/handsFixes, then status/note/fixes */
const SH_CHKS = ["Starts on the action", "Ends clean, note rings", "No ums, smacks, pauses", "One idea on its own"];
const SH_CHKS_H = ["Both hands in view", "Wrists not cut off", "Lettered keys on top", "No lyrics or extras"];
const SH_CHKS_W = ["Title + words right", "Graphic matches the music", "Nothing covers the hands", "Ending logo + link"];   /* (Oct 17) step 3 Words: fields words/wordsNote/wordsFixes, video wordsUrl (shorts-videos-up.py) */
const SH_CHKS_T = ["Title fills the width", "One graphic, the right one", "Real piano, both hands whole", "Nothing on the piano or cut off"];   /* (Oct 20) step 4 Thumbnail: fields thumb/thumbNote/thumbFixes, picture thumbUrl (shorts-videos-up.py) */
const SH_CHKS_F = ["Tall + wide play right", "Thumbnail is the approved one", "Posting copy right", "Post date OK"];   /* (Oct 21, Chris) step 5 Final: fields final/finalNote/finalFixes/finalOK, files finalTallUrl/finalWideUrl/finalThumbUrl + finalCopy/finalDate (shorts-final-up.py) */
const shAns = (r, st) => st === "hands" ? r.hands : st === "words" ? r.words : st === "thumb" ? r.thumb : st === "final" ? r.final : r.status;
const shQ = s => document.querySelector("#shortchk " + s);
const shLen = s => { s = Math.round(+s || 0); return s >= 60 ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : s + " s"; };
const shStep = r => !r.handsFileId ? null : !r.hands ? "hands" : r.hands === "approved" && !r.status ? "start" : r.status === "approved" && r.wordsUrl && !r.words ? "words" : r.words === "approved" && r.thumbUrl && !r.thumb ? "thumb" : null;
/* (Oct 21, Chris) ONE SOURCE for Shorts "his turn": shStep = a desk check page; shFinal = the final package is made and waits in Drive (6 Final Review/b Chris checks). The column cell, the title pill and the Today count all use shReady. Check: desk-checks.py shorts-state. */
const shFinal = r => !!(r.handsFileId && !r.moved && r.hands === "approved" && r.status === "approved" && r.words === "approved" && r.thumb === "approved" && r.final !== "approved" && r.final !== "fix" && r.auto && r.auto.step === "Final" && r.auto.state === "Ready");
const shReady = r => shStep(r) || (shFinal(r) ? "final" : null);
const shShow = r => (shView && shRows && r === shRows[shI] ? shView : null) || shStep(r) || (shFinal(r) || r.final ? "final" : r.words === "approved" && r.thumbUrl ? "thumb" : r.status === "approved" && r.wordsUrl ? "words" : r.hands === "approved" ? "start" : "hands");
const shFx = (r, st) => (st === "hands" ? r.handsFixes : st === "words" ? r.wordsFixes : st === "thumb" ? r.thumbFixes : st === "final" ? r.finalFixes : r.fixes) || [];
const shFk = st => st === "hands" ? "handsNote" : st === "words" ? "wordsNote" : st === "thumb" ? "thumbNote" : st === "final" ? "finalNote" : "note";
async function shOpen(tid, rid, view){
  shView = view || null; shOne = !!rid;
  const s = await db.collection("shortcheck").get(), all = s.docs.map(d => Object.assign({id: d.id}, d.data())).filter(r => !r.moved);
  shWait = all.filter(r => !r.handsFileId && !r.handsFail && !r.status).length;
  shRows = all.filter(r => r.handsFileId).sort((a, b) => (a.order || 0) - (b.order || 0) || String(a.id).localeCompare(String(b.id)));
  shTask = tid || null; const j = rid ? shRows.findIndex(r => r.id === rid) : -1, k = shRows.findIndex(shReady); shFm = "tall"; shI = j >= 0 ? j : k < 0 ? shRows.length : k; shDraw(); }
function shClose(){ shView = null; shOne = false; shRows = null; document.getElementById("shortchk").innerHTML = ""; shBoard = null; waitBusy.add("shorts"); if (tab === "today") render(); fdShLoad(); }
/* (Oct 21, Chris) FIX LIST: every fix he sent on this step, in order, above the checks: 'Fix N: his words' -> 'Done: what changed' + frames (tap = jump the video) + OK / Still wrong. Field fixList (shorts-fixlist.py). The note box opens EMPTY. */
const shFl = (r, st) => (r.fixList || []).filter(f => f.step === st);

  return `<div class="shfl" id="shfl">` + L.map(f => `<div class="shfi${f.ok === "bad" ? " bad" : f.ok === "ok" ? " good" : ""}"><div class="shfh">Fix ${f.n}: ${esc(f.chris || "")}</div>`
    + (f.done ? `<div class="shfd">Done: ${esc(f.done)}</div>` : `<div class="shfd">Being fixed</div>`)
    + ((f.frames || []).length && st !== "thumb" ? `<div class="shff">${f.frames.map(m => `<button type="button" class="shfr" data-shx="seekt" data-t="${esc(m.t)}">${m.img ? `<img src="${esc(m.img)}" alt="">` : ""}<span>${esc(m.label || "")}</span></button>`).join("")}</div>` : "")
    + (f.done && f.ok !== "redo" ? `<div class="shfb"><button type="button" class="shfo${f.ok === "ok" ? " on" : ""}" data-shx="fok" data-f="${esc(f.id)}">OK</button><button type="button" class="shfo no${f.ok === "bad" ? " on" : ""}" data-shx="fbad" data-f="${esc(f.id)}">Still wrong</button></div>` : "") + `</div>`).join("") + `</div>`; }
function shFixMark(id, v){ const r = shRows && shRows[shI]; if (!r) return; shNoteSave(); const f = (r.fixList || []).find(x => x.id === id); if (!f) return; f.ok = f.ok === v ? "" : v;

  const bad = shBad(r, step), raw = String(r[k] || "").replace(/^(Fix: [^;]*; ?)+/, "").trim(), picks = shFx(r, step).filter(i => CKS[i]).map(i => CKS[i]);
  const text = [picks.length ? "Not right: " + picks.join(", ") : "", bad.length ? "Still wrong: " + bad.map(f => "Fix " + f.n).join(", ") : "", raw].filter(Boolean).join(". ");

    h = head(N + " of " + N) + `<div class="shdone">${N ? `All checked: ${a} approved, ${d} sent back` : "Nothing to check yet"}${shWait ? `<br><span class="shsrc">${shWait} Hands version${shWait > 1 ? "s" : ""} still being made</span>` : ""}</div><div class="shbtns"><button type="button" class="tb" data-shx="back"${N ? "" : " disabled"}>Back</button><span></span><button type="button" class="tb go" data-shx="close">Done</button></div>`; }
  else if (shShow(r) === "final") h = shFinalHtml(r, head);
  else { const st = shShow(r), H = st === "hands", W = st === "words", T = st === "thumb", CK = H ? SH_CHKS_H : W ? SH_CHKS_W : T ? SH_CHKS_T : SH_CHKS, fx = shFx(r, st), ans = shAns(r, st);

     null, then the fallback below launched it again. A Lab link fires exactly ONE launch. */

  let w = null; try { w = window.open(iu, "_blank"); } catch {}
