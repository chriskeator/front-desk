<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Front Desk</title><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#FFFDF8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1F1F1F" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Front Desk"><link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png"><link rel="apple-touch-icon" href="icon-180-v2.png">
<style>:root{--bg:#FFFDF8;--card:#fff;--ink:#2A2F34;--muted:#6B7280;--line:#E8E2D4;--teal:#0F766E;--teal-ink:#fff;--field:#FFFDF8}
@media (prefers-color-scheme:dark){:root{--bg:#1F1F1F;--card:#2A2A2A;--ink:#ECECEC;--muted:#A7A7A0;--line:#3B4240;--teal:#3FB8AA;--teal-ink:#1F1F1F;--field:#292F2E;color-scheme:dark}}
body{margin:0;font-family:-apple-system,Helvetica,Arial;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:24px;text-align:center}input{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
button{font:inherit;font-weight:700;padding:12px;border-radius:10px;border:0;background:var(--teal);color:var(--teal-ink);cursor:pointer}button.alt{background:transparent;color:var(--teal);border:1px solid var(--line)}
p{margin:0;color:var(--muted);text-align:center;font-size:14px}</style></head><body>
<div class="card" id="app"><h1>Front Desk</h1><p>Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://cndzteukojzzjpmzmdxr.supabase.co", "sb_publishable_S6pzTaqMtZCSQoE_2Pkmew_QnzmBUM3");
const app = document.getElementById("app");
function login(msg){ app.innerHTML = '<h1>Front Desk</h1><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Sign in</button><button class="alt" id="ml">Email me a sign-in link</button><p id="m">' + (msg || "") + '</p>';
  document.getElementById("go").onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value }); if (error) m.textContent = "That didn't work. Try again."; else location.replace("app.html"); };
  document.getElementById("ml").onclick = async () => { const { error } = await sb.auth.signInWithOtp({ email: em.value.trim(), options: { shouldCreateUser: false, emailRedirectTo: location.origin } }); m.textContent = error ? "That email can't sign in here." : "Check your email for the sign-in link."; }; }
async function show(){ const { data } = await sb.auth.getSession(); if (!data.session) return login();
  if (!/account/.test(location.search)) return location.replace("app.html");
  const { count } = await sb.from("docs").select("id", { count: "exact", head: true });
  app.innerHTML = '<h1>Front Desk</h1><p>Signed in as ' + data.session.user.email + '.<br><b id="n">' + (count || 0) + '</b> items in your new desk.</p>' +
    '<label class="alt" style="display:block;text-align:center;font-weight:700;padding:12px;border-radius:10px;border:1px solid var(--line);color:var(--teal);cursor:pointer">Import my desk<input id="file" type="file" accept=".json" style="display:none"></label>' +
    '<p id="m"></p><button id="desk">Open my desk</button><button class="alt" id="out">Sign out</button>';
  document.getElementById("desk").onclick = () => location.replace("app.html");
  document.getElementById("out").onclick = async () => { await sb.auth.signOut(); login(); };
  document.getElementById("file").onchange = async e => { const f = e.target.files[0]; if (!f) return; const rows = JSON.parse(await f.text()); let done = 0;
    for (let i = 0; i < rows.length; i += 100){ const part = rows.slice(i, i + 100).map(r => ({ collection: r.collection, id: r.id, data: r.data }));
      const { error } = await sb.from("docs").upsert(part, { onConflict: "collection,id" }); if (error){ m.textContent = "Stopped: " + error.message; return; }
      done += part.length; m.textContent = "Imported " + done + " of " + rows.length + "…"; }
    const { count: c2 } = await sb.from("docs").select("id", { count: "exact", head: true }); n.textContent = c2; m.textContent = "Done: " + c2 + " items are in your new desk."; }; }
show();
</script></body></html>
