/* Sales card on Today (computer), Oct 3: 7 number buttons (each opens its detail), net sales graph (this period solid,
   last period dotted), View a day's sales. Details open in place of the graph, never under it (no page scroll). */
/* Lab palette only (Chris, Oct 3): teal #0F766E, orange #B4582F, mustard #97710F, green #4A7F37, ink #2A2F34; light shades
   #1FA598 #E07A45 #D19A12 #6AA84F, slate #5B6470. Never orange with mustard, never teal with green in one colour group.
   Chart series c0..c5 = teal, orange, slate, ink, light teal, light orange (no clash). --green = the main chart line (teal). */
:root{--green:#0F766E;--grid:#EFEAE0;--c0:#0F766E;--c1:#B4582F;--c2:#5B6470;--c3:#2A2F34;--c4:#1FA598;--c5:#E07A45}

.toprow{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}

.srow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.srow .scell{padding:3px 5px 3px 7px;height:52px;box-sizing:border-box;justify-content:center;overflow:hidden}

<script>
/* (Oct 15) Chris: a click (metronome) button next to the time signature; remembered per browser */
function scClickOn(){ try { return localStorage.getItem("scClick") === "1"; } catch { return false; } }
let scWords = null, scWSel = null;   /* (Oct 15) Chris: words are their own pieces under the numbers, dragged apart, snapped to the beat */
let scId = null, scDoc = null, scLines = null, scSel = null, scCtx = null, scTimer = null, scPlayEnd = null, scPH = null;
const SCDEG = {0:"1",1:"#1",2:"2",3:"b3",4:"3",5:"4",6:"#4",7:"5",8:"#5",9:"6",10:"b7",11:"7"};
const SCCH = ["1","4","5","6m","2m","3m",""], SCBASS = {"1":36,"2m":38,"3m":40,"4":41,"5":43,"6m":45};
const scClone = x => JSON.parse(JSON.stringify(x));
const scQ = s => document.querySelector("#songchk " + s);
async function scOpen(id){
  const s = await db.collection("songcheck").doc(id).get(); if (!s.exists) return;
  scId = id; scDoc = s.data(); scLines = scClone(scDoc.lines); scWords = scDoc.words ? scClone(scDoc.words) : scWordsFrom(scLines); scSel = null; scWSel = null; scDraw(); scPLoad(scLines.flat().map(n => n.m)); }
function scClose(){ scStop(); scId = null; scDoc = null; document.getElementById("songchk").innerHTML = ""; }
const scStep = () => scDoc.step || 1;
const scRows = () => ((scDoc.rows || {})[scStep()] || []);
const scWordsFrom = L => L.map(l => l.filter(n => n.w).map(n => ({g: n.g, w: n.w})));
/* each note keeps the word that starts on its beat (n.w), so the song files still read lines the same way */
function scSync(){ scLines.forEach((l, i) => l.forEach(n => { const w = (scWords[i] || []).find(x => Math.abs(x.g - n.g) < 1e-9); n.w = w ? w.w : ""; })); }
function scSaveSoon(){ clearTimeout(scTimer); scSync(); const id = scId, L = scClone(scLines), Wd = scClone(scWords); scTimer = setTimeout(() => { db.collection("songcheck").doc(id).update({lines: L, words: Wd, updated: new Date().toISOString()}).catch(() => {}); }, 500); }
function scDraw(){
  const st = scStep(), M = scDoc.meter, rows = scRows();
  document.getElementById("songchk").innerHTML = `<div class="scbg" data-scx="close"></div><div class="sccard" role="dialog" aria-modal="true"><div class="sch"><span class="t">${esc(scDoc.name)}</span><span class="scpill${st === 1 ? "" : " off"}">Step 1: melody</span><span class="scpill${st === 2 ? "" : " off"}">Step 2: chords</span><span class="sctsig">Time signature <b>${M}/4</b></span><button type="button" class="tb scclk${scClickOn() ? " on" : ""}" data-scx="click">${scClickOn() ? "Click on" : "Click off"}</button><span class="tn" id="sccnt" style="margin-left:auto"></span><button type="button" class="tb" data-scx="close">Close</button></div>`
    + `<div class="scrows${st === 2 ? " two" : ""}">` + scLines.map((l, i) => `<div class="scrow${st === 2 ? " two" : ""}${rows.includes(i) ? " done" : ""}"><div class="sctrk" data-sct="${i}"></div><button type="button" class="scck" data-scck="${i}" aria-label="Row done">&#10003;</button></div>`).join("") + `</div>`
    + `<div class="scbtns"><button type="button" class="tb" data-scx="play">${scCtx ? "Stop" : "Play"}</button>${st === 1 ? `<div class="scsel" id="scsel"></div>` : `<button type="button" class="tb" data-scx="back">Back to melody</button><span></span>`}<button type="button" class="tb" data-scx="reset">Reset</button><button type="button" class="tb go" data-scx="ok">${st === 1 ? "Approve melody" : "Approve chords"}</button></div></div>`;
  scCount(); scLines.forEach((l, i) => scTrack(i)); }
/* (Oct 15) Chris: a line glides left to right across each bar while it plays */
function scHead(){ if (!scCtx || !scPH) return; const el0 = (scCtx.currentTime - scPH.T) / scPH.B, S = scPH.segs;
  let sg = S[S.length - 1]; for (const q of S) if (el0 < q.t + q.e0 - q.s0){ sg = q; break; }
  const i = sg.i, beat = sg.s0 + Math.max(0, el0 - sg.t);
  const t = scQ(`[data-sct="${i}"]`);
  if (t){ const span = Math.max(...scLines.map(x => { const [p, q] = scRange(x); return q - p; })), [a] = scRange(scLines[i]), W = t.clientWidth / span;
    let el = document.getElementById("scph"); if (!el || el.parentNode !== t){ if (el) el.remove(); el = document.createElement("div"); el.id = "scph"; el.className = "scph"; t.appendChild(el); t.parentNode.scrollIntoView({block: "nearest", behavior: "smooth"}); }
    el.style.left = Math.max(0, Math.min(t.clientWidth - 3, (beat - a) * W)) + "px"; }
  requestAnimationFrame(scHead); }
function scCount(){ const c = document.getElementById("sccnt"); if (c) c.textContent = scRows().length + " of " + scLines.length + " rows done"; }
function scRange(l){ const M = scDoc.meter, a = Math.floor(Math.min(...l.map(n => n.g)) / M + 1e-9) * M, b = Math.ceil(Math.max(...l.map(n => n.g + n.L)) / M - 1e-9) * M; return [a, Math.max(b, a + M)]; }
function scTrack(i){
  const t = scQ(`[data-sct="${i}"]`); if (!t) return;
  const M = scDoc.meter, st = scStep(), l = scLines[i], span = Math.max(...scLines.map(x => { const [a, b] = scRange(x); return b - a; })), [a] = scRange(l), W = t.clientWidth / span;
  const first = Math.min(...l.map(n => n.g)), pick = first > a + 1e-9;
  let h = pick ? `<div class="scpk" style="left:0;width:${M * W}px"></div>` : "";
  for (let b = 1; b <= span; b++) h += `<div class="${b % M === 0 ? "scbl" : "scbt"}" style="left:${b * W - (b === span ? 2 : 0)}px"></div>`;
  for (let b = 0; b < span; b += M) h += `<div class="scbn" style="left:${b * W + 4}px">${b === 0 && pick ? "pickup" : "bar " + (Math.floor((a + b) / M) + 1)}</div>`;
  l.forEach((n, j) => {
    const x = (n.g - a) * W + 1, w = n.L * W - 2, c = (n.c || []).map(q => q[0]).join(" ");
    if (st === 2) h += `<div class="scc${c ? "" : " no"}" data-scc="${i}:${j}" style="left:${x}px;width:${w}px">${c ? esc(c) : "&middot;"}</div>`;
    const over = l.some((q, k) => k !== j && q.g < n.g + n.L - 1e-9 && n.g < q.g + q.L - 1e-9);
    h += `<div class="scn${over ? " x" : ""}${scSel === i + ":" + j ? " sel" : ""}" data-scn="${i}:${j}" style="left:${x}px;width:${w}px"><b>${SCDEG[n.m % 12]}</b><div class="sce" data-sce="l"></div><div class="sce" data-sce="r"></div></div>`; });
  const ws = (scWords[i] = (scWords[i] || []).sort((p, q) => p.g - q.g));
  h += `<div class="scwl" data-scwl="${i}"></div>`;
  ws.forEach((w, k) => { const e = k + 1 < ws.length ? ws[k + 1].g : a + span; h += `<div class="scw${scWSel === i + ":" + k ? " sel" : ""}" data-scw="${i}:${k}" style="left:${(w.g - a) * W + 1}px;width:${Math.max(W / 2, (e - w.g) * W - 4)}px"><span>${esc(w.w)}</span></div>`; });
  t.innerHTML = h; scSelBar(); }
